<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="topArc" d="M 30,120 A 90,90 0 0,1 210,120" />
  </defs>

  <!-- внешнее латунное кольцо, потолще -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#c9a24b" stroke-width="5" />
  <!-- тонкое внутреннее кольцо -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="#8a713a" stroke-width="1.5" />

  <!-- декоративные ромбики-засечки по бокам и снизу внешнего кольца -->
  <g fill="#c9a24b">
    <rect x="116.5" y="4" width="7" height="7" transform="rotate(45 120 7.5)" />
    <rect x="4" y="116.5" width="7" height="7" transform="rotate(45 7.5 120)" />
    <rect x="228.5" y="116.5" width="7" height="7" transform="rotate(45 232 120)" />
  </g>

  <!-- название паба дугой по верху -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-weight="bold" letter-spacing="2.5" fill="#c9a24b">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">O'ROMAN'S · PUB</textPath>
  </text>

  <!-- лавровые веточки по бокам медальона -->
  <g stroke="#8a713a" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M 68,120 Q 62,108 66,96 M 66,96 Q 58,98 56,92 M 66,96 Q 74,96 76,90" />
    <path d="M 68,120 Q 62,132 66,144 M 66,144 Q 58,142 56,148 M 66,144 Q 74,144 76,150" />
    <path d="M 172,120 Q 178,108 174,96 M 174,96 Q 182,98 184,92 M 174,96 Q 166,96 164,90" />
    <path d="M 172,120 Q 178,132 174,144 M 174,144 Q 182,142 184,148 M 174,144 Q 166,144 164,150" />
  </g>

  <!-- медальон с монограммой, двойной ободок для плотности -->
  <circle cx="120" cy="120" r="58" fill="none" stroke="#8a713a" stroke-width="2" />
  <circle cx="120" cy="120" r="52" fill="none" stroke="#c9a24b" stroke-width="1.5" />

  <!-- монограмма R с лёгкой обводкой для большей "жирности" -->
  <text x="120" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="bold"
        fill="#c9a24b" stroke="#c9a24b" stroke-width="1.5" text-anchor="middle" dominant-baseline="central">R</text>

  <!-- год основания -->
  <text x="120" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="bold" letter-spacing="2"
        fill="#c9a24b" text-anchor="middle">EST. 2024</text>

  <!-- декоративные точки по бокам года, теперь достаточно далеко от текста -->
  <circle cx="72" cy="194.5" r="2" fill="#c9a24b" />
  <circle cx="168" cy="194.5" r="2" fill="#c9a24b" />
</svg>
